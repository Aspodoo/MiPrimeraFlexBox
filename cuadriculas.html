<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadrícula Responsive</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Estilos básicos para visualizar las cajas */
        .box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .img-box {
            background-color: #cfe2ff;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-grande {
            height: 250px;
            background-color: #e2e3e5;
        }

        /* @MEDIA QUERIES */

        /* TABLET: Ocultar imágenes medianas (Pantallas entre 768px y 991px) */
        @media (min-width: 768px) and (max-width: 991px) {
            .ocultar-en-tablet {
                display: none !important;
            }
        }

        /* MÓVIL: Ajustes adicionales si los necesitas (Pantallas menores a 768px) */
        @media (max-width: 767px) {

            /* Aquí puedes forzar que las imágenes se intercalen si es necesario */
            .box {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container mt-4">

        <!-- SECCIÓN 1: Los 4 elementos superiores 
         Móvil: 1 por fila (col-12) | Tablet: 1 por fila (col-md-12) | PC: 4 por fila (col-lg-3) -->
        <div class="row">
            <div class="col-12 col-md-12 col-lg-3">
                <div class="box">Item 1</div>
            </div>
            <div class="col-12 col-md-12 col-lg-3">
                <div class="box">Item 2</div>
            </div>
            <div class="col-12 col-md-12 col-lg-3">
                <div class="box">Item 3</div>
            </div>
            <div class="col-12 col-md-12 col-lg-3">
                <div class="box">Item 4</div>
            </div>
        </div>

        <!-- SECCIÓN 2: Imagen Grande 
         Siempre ocupa el 100% (1 por fila) -->
        <div class="row">
            <div class="col-12">
                <div class="box img-box img-grande">IMG (Grande)</div>
            </div>
        </div>

        <!-- SECCIÓN 3: 2 Imágenes Medianas 
         Móvil: 1 por fila (col-12) | Tablet: Oculto por @media query | PC: 2 por fila (col-lg-6) -->
        <div class="row">
            <div class="col-12 col-lg-6 ocultar-en-tablet">
                <div class="box img-box">IMG (Mediana)</div>
            </div>
            <div class="col-12 col-lg-6 ocultar-en-tablet">
                <div class="box img-box">IMG (Mediana)</div>
            </div>
        </div>

        <!-- SECCIÓN 4: Los múltiples elementos inferiores (18 en total para cuadrar 6/3/2)
         Móvil: 2 por fila (col-6) | Tablet: 3 por fila (col-md-4) | PC: 6 por fila (col-lg-2) -->
        <div class="row">
            <!-- Fila 1 en PC (6 elementos) -->
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 1</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 2</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 3</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 4</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 5</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 6</div>
            </div>

            <!-- Fila 2 en PC (6 elementos) -->
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 7</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 8</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 9</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 10</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 11</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 12</div>
            </div>

            <!-- Fila 3 en PC (6 elementos) -->
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 13</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 14</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 15</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 16</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 17</div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="box">Item Inf 18</div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS (opcional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
